name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "fedora:latest", "rockylinux:9"]
    container: ${{ matrix.image }}
    steps:
      - name: Dependencias
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq shellcheck procps iproute2 >/dev/null
          else
            dnf install -y -q git jq procps-ng iproute findutils diffutils hostname >/dev/null
          fi
      - uses: actions/checkout@v4
      - name: Tests
        run: bash tests/run-tests.sh
